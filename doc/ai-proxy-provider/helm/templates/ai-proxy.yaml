{{/*这个是ai-proxy的中插件的文件定义，这个是插件实例，定义哪个路由使用它*/}}
{{- if .Values.codingplanDistributor.enabled }}
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  annotations:
    higress.io/wasm-plugin-description: >-
      Provide unified OpenAI API compatible interface to call different AI
      service providers.
    higress.io/wasm-plugin-icon: >-
      https://img.alicdn.com/imgextra/i1/O1CN018iKKih1iVx287RltL_!!6000000004419-2-tps-42-42.png
    higress.io/wasm-plugin-title: AI Proxy
  labels:
    higress.io/resource-definer: higress
    higress.io/wasm-plugin-built-in: 'true'
    higress.io/wasm-plugin-category: ai
    higress.io/wasm-plugin-name: ai-proxy
    higress.io/wasm-plugin-version: 1.0.0
  name: ai-proxy-1.0.0
  namespace: higress-system
spec:
  defaultConfigDisable: true
  failStrategy: FAIL_OPEN
  imagePullPolicy: UNSPECIFIED_POLICY
  matchRules:
    - config:
        provider:
          type: openai
      configDisable: false
      ingress:
      {{- $ingressName := printf "ai-route-%s-%s.internal" .Values.codingplanDistributor.secondIngress.commonName .Values.env }}
        - {{ $ingressName }}
  phase: UNSPECIFIED_PHASE
  priority: 100
  url: oci://higress-registry.cn-hangzhou.cr.aliyuncs.com/plugins/ai-proxy:2.0.0

{{- end }}