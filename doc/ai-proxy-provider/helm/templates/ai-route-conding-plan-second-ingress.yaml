{{- if .Values.codingplanDistributor.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  {{- $ingressName := printf "ai-route-%s-%s.internal" .Values.codingplanDistributor.secondIngress.commonName .Values.env }}
  name: {{ $ingressName }}
  namespace: {{ .Release.Namespace }}
  labels:
    higress.io/domain_higress-default-domain: 'true'
    higress.io/resource-definer: higress
    higress.io/internal: 'true'
  annotations:
    {{/*  这个请求的地址就是参考   */}}
    higress.io/destination: {{ .Values.codingplanDistributor.secondIngress.destination | default .Values.maasBase.fqdn }}
    higress.io/ignore-path-case: 'false'
    higress.io/enable-proxy-next-upstream: 'true'
    higress.io/proxy-next-upstream: error,timeout,non_idempotent
    higress.io/proxy-next-upstream-timeout: '120000'
    higress.io/proxy-next-upstream-tries: '3'
spec:
  ingressClassName: higress
  rules:
    - http:
        paths:
          - path: {{ .Values.codingplanDistributor.secondIngress.path | default "/inner/api/coding" }}
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
{{- end }}
